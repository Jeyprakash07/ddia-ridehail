name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A real Postgres, so the store contract tests run instead of skipping.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ridehail
          POSTGRES_USER: ridehail
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ridehail -d ridehail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ridehail:ci-only@localhost:5432/ridehail?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # TestPercentile fails until exercise 1a is done. Remove the -skip then.
      - run: go test -race -count=1 -skip '^TestPercentile$' ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  # Scans the image for known vulnerabilities. Needs the SNYK_TOKEN secret;
  # without it the scan is skipped with a warning instead of failing.
  image-scan:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - if: env.SNYK_TOKEN == ''
        run: echo "::warning::SNYK_TOKEN is not set, so the image scan was skipped."
      - if: env.SNYK_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.SNYK_TOKEN != ''
        run: docker build -t ridehail:scan .
      - if: env.SNYK_TOKEN != ''
        uses: snyk/actions/docker@master
        with:
          image: ridehail:scan
          args: --file=Dockerfile --severity-threshold=high

  # Publishes the image only for commits on main, tagged with the commit SHA.
  image:
    needs: [test, lint, image-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Registry image names must be lowercase; the owner name is not.
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
